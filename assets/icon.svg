<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="104" y1="128" x2="392" y2="390" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="0.55" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <circle cx="256" cy="236" r="210" fill="url(#glow)"/>

  <!-- remote-wake signal -->
  <g fill="none" stroke="#22d3ee" stroke-linecap="round">
    <path d="M392 176a58 58 0 0 1 0 82" stroke-width="18" opacity="0.55"/>
    <path d="M424 146a96 96 0 0 1 0 142" stroke-width="18" opacity="0.3"/>
  </g>

  <!-- monitor -->
  <rect x="104" y="128" width="288" height="196" rx="30"
        fill="#0b1220" fill-opacity="0.55"
        stroke="url(#accent)" stroke-width="20"/>
  <path d="M256 324v48" fill="none" stroke="url(#accent)" stroke-width="20" stroke-linecap="round"/>
  <path d="M196 382h120" fill="none" stroke="url(#accent)" stroke-width="20" stroke-linecap="round"/>

  <!-- power glyph -->
  <g fill="none" stroke="url(#accent)" stroke-width="20" stroke-linecap="round">
    <path d="M292 198a52 52 0 1 1-72 0"/>
    <path d="M256 166v46"/>
  </g>

  <!-- power glyph glow -->
  <g fill="none" stroke="#38bdf8" stroke-width="20" stroke-linecap="round" filter="url(#soft)" opacity="0.5">
    <path d="M292 198a52 52 0 1 1-72 0"/>
    <path d="M256 166v46"/>
  </g>
</svg>
